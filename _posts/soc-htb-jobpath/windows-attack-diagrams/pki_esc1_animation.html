<style>
    .kerb-container {
        font-family: inherit;
        margin: 2rem 0;
        display: flex;
        flex-direction: column;
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 1.5rem;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .kerb-diagram {
        position: relative;
        height: 440px;
        background: transparent;
        border-radius: 8px;
        overflow: visible;
    }

    .kerb-node {
        position: absolute;
        width: 140px;
        padding: 1rem 0.5rem;
        background: var(--main-bg, #1e1e1e);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        transition: all 0.3s ease;
        z-index: 10;
        color: var(--text-muted-color, #aaa);
    }
    
    .kerb-node.active {
        color: var(--text-color, #fff);
        border-color: var(--link-color, #85c49b);
        box-shadow: 0 0 15px rgba(133, 196, 155, 0.2);
    }

    .kerb-node-title {
        font-weight: 600;
        font-size: 0.85rem;
        margin-top: 10px;
    }
    
    .kerb-node-icon {
        font-size: 2.2rem;
    }

    /* Node positioning */
    #esc1-node-atk { top: 160px; left: 2%; }
    #esc1-node-ca { top: 30px; right: 5%; }
    #esc1-node-dc { bottom: 30px; right: 5%; }

    /* SVG Lines connecting nodes */
    .kerb-svg {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 1;
        pointer-events: none;
    }
    .kerb-line {
        stroke: rgba(255,255,255,0.2);
        stroke-width: 1.5;
        stroke-dasharray: 4, 4;
        transition: all 0.3s ease;
    }
    .kerb-line.active {
        stroke: var(--link-color, #85c49b);
        stroke-dasharray: none;
        stroke-width: 2.5;
    }

    /* Dynamic Packet animation */
    .kerb-packet {
        position: absolute;
        top: 0; left: 0;
        font-size: 1.5rem;
        color: var(--link-color, #85c49b);
        z-index: 5;
        opacity: 0;
        pointer-events: none;
        text-shadow: 0 0 12px var(--link-color, #85c49b);
    }
    
    @keyframes esc1-move-atk-ca {
        0% { transform: translate(calc(var(--atk-x) - 12px), calc(var(--atk-y) - 12px)); opacity: 1; }
        100% { transform: translate(calc(var(--ca-x) - 12px), calc(var(--ca-y) - 12px)); opacity: 1; }
    }
    @keyframes esc1-move-ca-atk {
        0% { transform: translate(calc(var(--ca-x) - 12px), calc(var(--ca-y) - 12px)); opacity: 1; }
        100% { transform: translate(calc(var(--atk-x) - 12px), calc(var(--atk-y) - 12px)); opacity: 1; }
    }
    @keyframes esc1-move-atk-dc {
        0% { transform: translate(calc(var(--atk-x) - 12px), calc(var(--atk-y) - 12px)); opacity: 1; }
        100% { transform: translate(calc(var(--dc-x) - 12px), calc(var(--dc-y) - 12px)); opacity: 1; }
    }
    @keyframes esc1-move-dc-atk {
        0% { transform: translate(calc(var(--dc-x) - 12px), calc(var(--dc-y) - 12px)); opacity: 1; }
        100% { transform: translate(calc(var(--atk-x) - 12px), calc(var(--atk-y) - 12px)); opacity: 1; }
    }

    .anim-atk-ca { animation: esc1-move-atk-ca 1.5s ease-in-out forwards; }
    .anim-ca-atk { animation: esc1-move-ca-atk 1.5s ease-in-out forwards; }
    .anim-atk-dc { animation: esc1-move-atk-dc 1.5s ease-in-out forwards; }
    .anim-dc-atk { animation: esc1-move-dc-atk 1.5s ease-in-out forwards; }

    /* Waiting Icon */
    .waiting-icon {
        display: none;
        position: absolute;
        top: -12px;
        right: -12px;
        font-size: 1.2rem;
        color: var(--link-color, #85c49b);
        background: var(--main-bg, #1e1e1e);
        border-radius: 50%;
        width: 32px;
        height: 32px;
        line-height: 32px;
        text-align: center;
        box-shadow: 0 0 10px rgba(0,0,0,0.8);
        z-index: 15;
    }
    .kerb-node.waiting .waiting-icon {
        display: block;
    }

    /* Chat Bubbles */
    .chat-bubble {
        position: absolute;
        background: rgba(30, 30, 30, 0.95);
        border: 1px solid var(--link-color, #85c49b);
        color: #fff;
        padding: 0.8rem 1rem;
        border-radius: 8px;
        font-size: 0.8rem;
        line-height: 1.5;
        max-width: 340px;
        z-index: 20;
        opacity: 0;
        transform: translateY(10px);
        transition: all 0.4s ease;
        pointer-events: none;
        box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    .chat-bubble.show {
        opacity: 1;
        transform: translateY(0);
    }
    .chat-bubble::after {
        content: '';
        position: absolute;
        width: 0; height: 0;
    }
    
    #esc1-diagram .bubble-atk { left: 2%; top: 60px; }
    #esc1-diagram .bubble-atk::after { top: auto; bottom: -12px; left: 70px; border: 6px solid transparent; border-top-color: var(--link-color, #85c49b); }
    #esc1-diagram .bubble-ca { right: 200px; top: 30px; }
    #esc1-diagram .bubble-ca::after { top: 20px; bottom: auto; right: -12px; left: auto; border: 6px solid transparent; border-left-color: var(--link-color, #85c49b); }
    #esc1-diagram .bubble-dc { right: 200px; bottom: 30px; }
    #esc1-diagram .bubble-dc::after { top: 20px; bottom: auto; right: -12px; left: auto; border: 6px solid transparent; border-left-color: var(--link-color, #85c49b); }

    /* Responsive Design */
    @media (max-width: 650px) {
        .kerb-node {
            width: 100px;
            padding: 0.5rem;
        }
        .kerb-node-icon { font-size: 1.5rem; }
        .kerb-node-title { font-size: 0.75rem; }
        #esc1-node-atk { left: 0%; top: 160px; }
        #esc1-node-ca { right: 0%; top: 40px; }
        #esc1-node-dc { right: 0%; bottom: 30px; }
        
        #esc1-diagram .bubble-atk { left: 0%; top: 60px; max-width: 200px; font-size: 0.8rem; }
        #esc1-diagram .bubble-ca { right: 110px; top: 30px; max-width: 200px; font-size: 0.8rem; }
        #esc1-diagram .bubble-dc { right: 110px; bottom: 30px; max-width: 200px; font-size: 0.8rem; }
        
        #esc1-diagram .bubble-atk::after { left: 45px; }
        #esc1-diagram .bubble-ca::after { top: 20px; bottom: auto; right: -12px; left: auto; border: 6px solid transparent; border-left-color: var(--link-color, #85c49b); }
        #esc1-diagram .bubble-dc::after { top: 20px; bottom: auto; right: -12px; left: auto; border: 6px solid transparent; border-left-color: var(--link-color, #85c49b); }
    }

    /* Controls */
    .kerb-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 1.5rem;
        border-top: 1px solid rgba(255,255,255,0.1);
        margin-top: 1rem;
    }
    
    .kerb-btn {
        background: rgba(255,255,255,0.05);
        color: var(--text-color, #fff);
        border: 1px solid rgba(255,255,255,0.2);
        padding: 0.5rem 1.2rem;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 600;
        transition: all 0.2s ease;
    }
    .kerb-btn:hover:not(:disabled) {
        background: rgba(133, 196, 155, 0.2);
        color: var(--link-color, #85c49b);
        border-color: var(--link-color, #85c49b);
    }
    .kerb-btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
    }
    
    .kerb-progress {
        font-size: 0.9rem;
        color: var(--text-muted-color, #aaa);
        font-weight: 600;
    }
</style>

<div class="kerb-container" id="esc1-container">
    <div class="kerb-diagram" id="esc1-diagram">
        <!-- SVG for lines -->
        <svg class="kerb-svg">
            <line class="kerb-line" id="esc1-line-atk-ca" />
            <line class="kerb-line" id="esc1-line-atk-dc" />
        </svg>

        <!-- Nodes with FontAwesome icons -->
        <div class="kerb-node" id="esc1-node-atk">
            <i class="fas fa-spinner fa-spin waiting-icon"></i>
            <i class="fas fa-laptop-code kerb-node-icon"></i>
            <div class="kerb-node-title">Attacker<br><span style="font-size: 0.75em; opacity: 0.7">(Standard User)</span></div>
        </div>
        
        <div class="kerb-node" id="esc1-node-ca">
            <i class="fas fa-spinner fa-spin waiting-icon"></i>
            <i class="fas fa-certificate kerb-node-icon"></i>
            <div class="kerb-node-title">Certificate Authority<br><span style="font-size: 0.75em; opacity: 0.7">(AD CS)</span></div>
        </div>

        <div class="kerb-node" id="esc1-node-dc">
            <i class="fas fa-spinner fa-spin waiting-icon"></i>
            <i class="fas fa-sitemap kerb-node-icon"></i>
            <div class="kerb-node-title">Domain Controller<br><span style="font-size: 0.75em; opacity: 0.7">(Target Service)</span></div>
        </div>

        <!-- Chat Bubbles -->
        <div class="chat-bubble bubble-atk" id="esc1-bubble-atk"></div>
        <div class="chat-bubble bubble-ca" id="esc1-bubble-ca"></div>
        <div class="chat-bubble bubble-dc" id="esc1-bubble-dc"></div>

        <!-- Packet -->
        <div class="kerb-packet" id="esc1-packet"><i class="fas fa-envelope"></i></div>
    </div>
    
    <div class="kerb-controls">
        <button class="kerb-btn" id="esc1-prev" disabled>← Prev</button>
        <span class="kerb-progress" id="esc1-progress">[ Step 1 / 11 ]</span>
        <button class="kerb-btn" id="esc1-next">Next →</button>
    </div>
</div>

<script>
(() => {
    const steps = [
        {
            sender: 'atk', text: "Setup: I am a standard domain user. My goal is to exploit Active Directory Certificate Services (AD CS).",
            activeNodes: ['esc1-node-atk'], activeLines: [], anim: null
        },
        {
            sender: 'atk', text: "Reconnaissance: Using a tool like Certify, I will scan the AD CS for vulnerable certificate templates.",
            activeNodes: ['esc1-node-atk', 'esc1-node-ca'], activeLines: ['esc1-line-atk-ca'], anim: 'anim-atk-ca'
        },
        {
            sender: 'ca', text: "Template Details: Here is the list. Oh, look! The 'User' template allows Client Authentication and Enrollee Supplies Subject (ESC1)!",
            activeNodes: ['esc1-node-atk', 'esc1-node-ca'], activeLines: ['esc1-line-atk-ca'], anim: 'anim-ca-atk'
        },
        {
            sender: 'atk', text: "Exploitation: I will request a certificate using this template. In the request, I will set the Subject Alternative Name (SAN) to 'Administrator'.",
            activeNodes: ['esc1-node-atk', 'esc1-node-ca'], activeLines: ['esc1-line-atk-ca'], anim: 'anim-atk-ca'
        },
        {
            sender: 'ca', text: "Processing Request: The template allows Enrollee Supplies Subject, and no manager approval is required.",
            activeNodes: ['esc1-node-atk', 'esc1-node-ca'], activeLines: ['esc1-line-atk-ca'], anim: null
        },
        {
            sender: 'ca', text: "Issuance: Everything looks valid according to the template rules. Here is a shiny new certificate issued for 'Administrator'!",
            activeNodes: ['esc1-node-atk', 'esc1-node-ca'], activeLines: ['esc1-line-atk-ca'], anim: 'anim-ca-atk'
        },
        {
            sender: 'atk', text: "Conversion: Excellent. I will use openssl to convert this certificate and private key into a usable PFX format.",
            activeNodes: ['esc1-node-atk'], activeLines: [], anim: null
        },
        {
            sender: 'atk', text: "Authentication: Now I will use Rubeus to request a Kerberos TGT from the Domain Controller, using the forged certificate for PKINIT authentication.",
            activeNodes: ['esc1-node-atk', 'esc1-node-dc'], activeLines: ['esc1-line-atk-dc'], anim: 'anim-atk-dc'
        },
        {
            sender: 'dc', text: "Verification: I received a PKINIT request. The certificate is signed by our trusted CA and identifies the user as 'Administrator'.",
            activeNodes: ['esc1-node-atk', 'esc1-node-dc'], activeLines: ['esc1-line-atk-dc'], anim: null
        },
        {
            sender: 'dc', text: "TGT Issuance: The authentication is valid. Here is the Kerberos Ticket Granting Ticket (TGT) for the Administrator account.",
            activeNodes: ['esc1-node-atk', 'esc1-node-dc'], activeLines: ['esc1-line-atk-dc'], anim: 'anim-dc-atk'
        },
        {
            sender: 'atk', text: "Success: I can now inject this TGT into memory (Pass-the-Ticket) and take complete control of the domain as the Administrator!",
            activeNodes: ['esc1-node-atk'], activeLines: [], anim: null
        }
    ];

    let currentStep = 0;
    
    const progressEl = document.getElementById('esc1-progress');
    const prevBtn = document.getElementById('esc1-prev');
    const nextBtn = document.getElementById('esc1-next');
    const packetEl = document.getElementById('esc1-packet');
    const diagramEl = document.getElementById('esc1-diagram');
    
    const bubbleAtk = document.getElementById('esc1-bubble-atk');
    const bubbleCa = document.getElementById('esc1-bubble-ca');
    const bubbleDc = document.getElementById('esc1-bubble-dc');
    
    const allNodes = ['esc1-node-atk', 'esc1-node-ca', 'esc1-node-dc'];
    const allLines = ['esc1-line-atk-ca', 'esc1-line-atk-dc'];

    function drawLines() {
        try {
            const getCenter = (id) => {
                const el = document.getElementById(id);
                if (!el) return {x:0, y:0};
                return {
                    x: el.offsetLeft + el.offsetWidth / 2,
                    y: el.offsetTop + el.offsetHeight / 2
                };
            };

            const cAtk = getCenter('esc1-node-atk');
            const cCa = getCenter('esc1-node-ca');
            const cDc = getCenter('esc1-node-dc');

            const lAtkCa = document.getElementById('esc1-line-atk-ca');
            if (lAtkCa) {
                lAtkCa.setAttribute('x1', cAtk.x);
                lAtkCa.setAttribute('y1', cAtk.y);
                lAtkCa.setAttribute('x2', cCa.x);
                lAtkCa.setAttribute('y2', cCa.y);
            }

            const lAtkDc = document.getElementById('esc1-line-atk-dc');
            if (lAtkDc) {
                lAtkDc.setAttribute('x1', cAtk.x);
                lAtkDc.setAttribute('y1', cAtk.y);
                lAtkDc.setAttribute('x2', cDc.x);
                lAtkDc.setAttribute('y2', cDc.y);
            }

            diagramEl.style.setProperty('--atk-x', cAtk.x + 'px');
            diagramEl.style.setProperty('--atk-y', cAtk.y + 'px');
            diagramEl.style.setProperty('--ca-x', cCa.x + 'px');
            diagramEl.style.setProperty('--ca-y', cCa.y + 'px');
            diagramEl.style.setProperty('--dc-x', cDc.x + 'px');
            diagramEl.style.setProperty('--dc-y', cDc.y + 'px');
        } catch(e) {
            console.error(e);
        }
    }

    window.addEventListener('resize', drawLines);

    function updateDiagram() {
        try { drawLines(); } catch(e) { console.error(e); }
        if (!steps || !steps.length) return;
        
        const step = steps[currentStep];
        if (!step) return;
        
        if (progressEl) progressEl.innerText = `[ Step ${currentStep + 1} / ${steps.length} ]`;
        
        if (prevBtn) prevBtn.disabled = currentStep === 0;
        if (nextBtn) nextBtn.disabled = currentStep === steps.length - 1;
        
        if (allNodes && step.activeNodes) {
            allNodes.forEach(id => {
                let node = document.getElementById(id);
                if (node) {
                    if (step.activeNodes.includes(id)) node.classList.add('active');
                    else node.classList.remove('active');
                    
                    if (step.anim === null && id === 'esc1-node-' + step.sender) {
                        node.classList.add('waiting');
                    } else {
                        node.classList.remove('waiting');
                    }
                }
            });
        }
        
        if (allLines && step.activeLines) {
            allLines.forEach(id => {
                let line = document.getElementById(id);
                if (line) {
                    if (step.activeLines.includes(id)) line.classList.add('active');
                    else line.classList.remove('active');
                }
            });
        }
        
        if (bubbleAtk) bubbleAtk.classList.remove('show');
        if (bubbleCa) bubbleCa.classList.remove('show');
        if (bubbleDc) bubbleDc.classList.remove('show');
        
        setTimeout(() => {
            if (step.sender === 'atk' && bubbleAtk) {
                bubbleAtk.innerText = step.text;
                bubbleAtk.classList.add('show');
            } else if (step.sender === 'ca' && bubbleCa) {
                bubbleCa.innerText = step.text;
                bubbleCa.classList.add('show');
            } else if (step.sender === 'dc' && bubbleDc) {
                bubbleDc.innerText = step.text;
                bubbleDc.classList.add('show');
            }
        }, 100);
        
        if (packetEl) {
            packetEl.className = 'kerb-packet';
            void packetEl.offsetWidth; 
            if (step.anim) {
                packetEl.classList.add(step.anim);
            }
        }
    }

    if (prevBtn) {
        prevBtn.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateDiagram();
            }
        });
    }

    if (nextBtn) {
        nextBtn.addEventListener('click', () => {
            if (currentStep < steps.length - 1) {
                currentStep++;
                updateDiagram();
            }
        });
    }

    setTimeout(updateDiagram, 100);
})();
</script>
