<style>
    .kerb-container {
        font-family: inherit;
        margin: 2rem 0;
        display: flex;
        flex-direction: column;
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 1.5rem;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .kerb-diagram {
        position: relative;
        height: 440px;
        background: transparent;
        border-radius: 8px;
        overflow: visible;
    }

    .kerb-node {
        position: absolute;
        width: 140px;
        padding: 1rem 0.5rem;
        background: var(--main-bg, #1e1e1e);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        transition: all 0.3s ease;
        z-index: 10;
        color: var(--text-muted-color, #aaa);
    }
    
    .kerb-node.active {
        color: var(--text-color, #fff);
        border-color: var(--link-color, #85c49b);
        box-shadow: 0 0 15px rgba(133, 196, 155, 0.2);
    }

    .kerb-node-title {
        font-weight: 600;
        font-size: 0.85rem;
        margin-top: 10px;
    }
    
    .kerb-node-icon {
        font-size: 2.2rem;
    }

    /* Node positioning */
    #ud-node-atk { top: 160px; left: 2%; }
    #ud-node-dc { top: 30px; right: 5%; }
    #ud-node-ud { bottom: 30px; right: 5%; }

    /* SVG Lines connecting nodes */
    .kerb-svg {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 1;
        pointer-events: none;
    }
    .kerb-line {
        stroke: rgba(255,255,255,0.2);
        stroke-width: 1.5;
        stroke-dasharray: 4, 4;
        transition: all 0.3s ease;
    }
    .kerb-line.active {
        stroke: var(--link-color, #85c49b);
        stroke-dasharray: none;
        stroke-width: 2.5;
    }

    /* Dynamic Packet animation */
    .kerb-packet {
        position: absolute;
        top: 0; left: 0;
        font-size: 1.5rem;
        color: var(--link-color, #85c49b);
        z-index: 5;
        opacity: 0;
        pointer-events: none;
        text-shadow: 0 0 12px var(--link-color, #85c49b);
    }
    
    @keyframes ud-move-atk-dc {
        0% { transform: translate(calc(var(--atk-x) - 12px), calc(var(--atk-y) - 12px)); opacity: 1; }
        100% { transform: translate(calc(var(--dc-x) - 12px), calc(var(--dc-y) - 12px)); opacity: 1; }
    }
    @keyframes ud-move-dc-ud {
        0% { transform: translate(calc(var(--dc-x) - 12px), calc(var(--dc-y) - 12px)); opacity: 1; }
        100% { transform: translate(calc(var(--ud-x) - 12px), calc(var(--ud-y) - 12px)); opacity: 1; }
    }
    @keyframes ud-move-ud-atk {
        0% { transform: translate(calc(var(--ud-x) - 12px), calc(var(--ud-y) - 12px)); opacity: 1; }
        100% { transform: translate(calc(var(--atk-x) - 12px), calc(var(--atk-y) - 12px)); opacity: 1; }
    }
    @keyframes ud-move-dc-atk {
        0% { transform: translate(calc(var(--dc-x) - 12px), calc(var(--dc-y) - 12px)); opacity: 1; }
        100% { transform: translate(calc(var(--atk-x) - 12px), calc(var(--atk-y) - 12px)); opacity: 1; }
    }
    @keyframes ud-offline-crack {
        0% { transform: translate(calc(var(--atk-x) - 12px), calc(var(--atk-y) - 12px)) scale(1); opacity: 1; color: var(--link-color); text-shadow: 0 0 10px var(--link-color); }
        50% { transform: translate(calc(var(--atk-x) - 12px), calc(var(--atk-y) - 12px)) scale(2); opacity: 1; color: #ef4444; text-shadow: 0 0 20px #ef4444; }
        100% { transform: translate(calc(var(--atk-x) - 12px), calc(var(--atk-y) - 12px)) scale(1); opacity: 0; }
    }

    .anim-atk-dc { animation: ud-move-atk-dc 1.5s ease-in-out forwards; }
    .anim-dc-ud { animation: ud-move-dc-ud 1.5s ease-in-out forwards; }
    .anim-ud-atk { animation: ud-move-ud-atk 1.5s ease-in-out forwards; }
    .anim-dc-atk { animation: ud-move-dc-atk 1.5s ease-in-out forwards; }
    .anim-crack { animation: ud-offline-crack 2s ease-in-out forwards; }

    /* Waiting Icon */
    .waiting-icon {
        display: none;
        position: absolute;
        top: -12px;
        right: -12px;
        font-size: 1.2rem;
        color: var(--link-color, #85c49b);
        background: var(--main-bg, #1e1e1e);
        border-radius: 50%;
        width: 32px;
        height: 32px;
        line-height: 32px;
        text-align: center;
        box-shadow: 0 0 10px rgba(0,0,0,0.8);
        z-index: 15;
    }
    .kerb-node.waiting .waiting-icon {
        display: block;
    }

    /* Chat Bubbles */
    .chat-bubble {
        position: absolute;
        background: rgba(30, 30, 30, 0.95);
        border: 1px solid var(--link-color, #85c49b);
        color: #fff;
        padding: 0.8rem 1rem;
        border-radius: 8px;
        font-size: 0.8rem;
        line-height: 1.5;
        max-width: 340px;
        z-index: 20;
        opacity: 0;
        transform: translateY(10px);
        transition: all 0.4s ease;
        pointer-events: none;
        box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    .chat-bubble.show {
        opacity: 1;
        transform: translateY(0);
    }
    .chat-bubble::after {
        content: '';
        position: absolute;
        width: 0; height: 0;
    }
    
    #ud-diagram .bubble-atk { left: 2%; top: 60px; }
    #ud-diagram .bubble-atk::after { top: auto; bottom: -12px; left: 70px; border: 6px solid transparent; border-top-color: var(--link-color, #85c49b); }
    #ud-diagram .bubble-dc { right: 200px; top: 40px; }
    #ud-diagram .bubble-dc::after { top: 20px; bottom: auto; right: -12px; left: auto; border: 6px solid transparent; border-left-color: var(--link-color, #85c49b); }
    #ud-diagram .bubble-ud { right: 200px; bottom: 40px; }
    #ud-diagram .bubble-ud::after { top: 20px; bottom: auto; right: -12px; left: auto; border: 6px solid transparent; border-left-color: var(--link-color, #85c49b); }

    /* Responsive Design */
    @media (max-width: 650px) {
        .kerb-node {
            width: 100px;
            padding: 0.5rem;
        }
        .kerb-node-icon { font-size: 1.5rem; }
        .kerb-node-title { font-size: 0.75rem; }
        #ud-node-atk { left: 0%; top: 160px; }
        #ud-node-dc { right: 0%; top: 40px; }
        #ud-node-ud { right: 0%; bottom: 30px; }
        
        #ud-diagram .bubble-atk { left: 0%; top: 60px; max-width: 200px; font-size: 0.8rem; }
        #ud-diagram .bubble-dc { right: 110px; top: 40px; max-width: 200px; font-size: 0.8rem; }
        #ud-diagram .bubble-ud { right: 110px; bottom: 40px; max-width: 200px; font-size: 0.8rem; }
        
        #ud-diagram .bubble-atk::after { left: 45px; }
        #ud-diagram .bubble-dc::after { right: -12px; top: 20px; border-color: transparent transparent transparent var(--link-color, #85c49b); }
        #ud-diagram .bubble-ud::after { right: -12px; top: 20px; border-color: transparent transparent transparent var(--link-color, #85c49b); }
    }

    /* Controls */
    .kerb-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 1.5rem;
        border-top: 1px solid rgba(255,255,255,0.1);
        margin-top: 1rem;
    }
    
    .kerb-btn {
        background: rgba(255,255,255,0.05);
        color: var(--text-color, #fff);
        border: 1px solid rgba(255,255,255,0.2);
        padding: 0.5rem 1.2rem;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 600;
        transition: all 0.2s ease;
    }
    .kerb-btn:hover:not(:disabled) {
        background: rgba(133, 196, 155, 0.2);
        color: var(--link-color, #85c49b);
        border-color: var(--link-color, #85c49b);
    }
    .kerb-btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
    }
    
    .kerb-progress {
        font-size: 0.9rem;
        color: var(--text-muted-color, #aaa);
        font-weight: 600;
    }
</style>

<div class="kerb-container" id="ud-container">
    <div class="kerb-diagram" id="ud-diagram">
        <!-- SVG for lines -->
        <svg class="kerb-svg">
            <line class="kerb-line" id="ud-line-atk-dc" />
            <line class="kerb-line" id="ud-line-dc-ud" />
            <line class="kerb-line" id="ud-line-atk-ud" />
        </svg>

        <!-- Nodes with FontAwesome icons -->
        <div class="kerb-node" id="ud-node-atk">
            <i class="fas fa-spinner fa-spin waiting-icon"></i>
            <i class="fas fa-laptop-code kerb-node-icon"></i>
            <div class="kerb-node-title">Attacker<br><span style="font-size: 0.75em; opacity: 0.7">(Local Admin)</span></div>
        </div>
        
        <div class="kerb-node" id="ud-node-dc">
            <i class="fas fa-spinner fa-spin waiting-icon"></i>
            <i class="fas fa-sitemap kerb-node-icon"></i>
            <div class="kerb-node-title">Target DC<br><span style="font-size: 0.75em; opacity: 0.7">(Domain Controller)</span></div>
        </div>

        <div class="kerb-node" id="ud-node-ud">
            <i class="fas fa-spinner fa-spin waiting-icon"></i>
            <i class="fas fa-server kerb-node-icon"></i>
            <div class="kerb-node-title">UD Server<br><span style="font-size: 0.75em; opacity: 0.7">(Unconstrained Delegation)</span></div>
        </div>

        <!-- Chat Bubbles -->
        <div class="chat-bubble bubble-atk" id="ud-bubble-atk"></div>
        <div class="chat-bubble bubble-dc" id="ud-bubble-dc"></div>
        <div class="chat-bubble bubble-ud" id="ud-bubble-ud"></div>

        <!-- Packet -->
        <div class="kerb-packet" id="ud-packet"><i class="fas fa-envelope"></i></div>
    </div>
    
    <div class="kerb-controls">
        <button class="kerb-btn" id="ud-prev" disabled>← Prev</button>
        <span class="kerb-progress" id="ud-progress">[ Step 1 / 14 ]</span>
        <button class="kerb-btn" id="ud-next">Next →</button>
    </div>
</div>

<script>
(() => {
    const steps = [
        {
            sender: 'atk', text: "Setup: I have compromised a server that is trusted for Unconstrained Delegation (UD Server).",
            activeNodes: ['ud-node-atk', 'ud-node-ud'], activeLines: ['ud-line-atk-ud'], anim: null
        },
        {
            sender: 'atk', text: "Monitoring: I will run Rubeus on the UD Server to listen for and capture any incoming Ticket Granting Tickets (TGTs).",
            activeNodes: ['ud-node-atk', 'ud-node-ud'], activeLines: ['ud-line-atk-ud'], anim: null
        },
        {
            sender: 'atk', text: "Coercion: Using a tool like Coercer or PetitPotam, I will target the Domain Controller via a vulnerable RPC function.",
            activeNodes: ['ud-node-atk'], activeLines: [], anim: null
        },
        {
            sender: 'atk', text: "Trigger: Hey Target DC! Connect to the UD Server using EFS RPC (MS-EFSRPC) or PrinterBug!",
            activeNodes: ['ud-node-atk', 'ud-node-dc'], activeLines: ['ud-line-atk-dc'], anim: 'anim-atk-dc'
        },
        {
            sender: 'dc', text: "RPC Request: I received a forced authentication request. I must connect back to the provided IP (the UD Server).",
            activeNodes: ['ud-node-atk', 'ud-node-dc'], activeLines: ['ud-line-atk-dc'], anim: null
        },
        {
            sender: 'dc', text: "Authentication: Because the UD Server has Unconstrained Delegation enabled, I am required to send a copy of my TGT!",
            activeNodes: ['ud-node-dc'], activeLines: [], anim: null
        },
        {
            sender: 'dc', text: "TGT Forwarding: Here is my authentication request, including my cached TGT, so you can delegate on my behalf.",
            activeNodes: ['ud-node-dc', 'ud-node-ud'], activeLines: ['ud-line-dc-ud'], anim: 'anim-dc-ud'
        },
        {
            sender: 'ud', text: "Caching: The UD Server receives the authentication and automatically caches the Target DC's TGT in memory.",
            activeNodes: ['ud-node-dc', 'ud-node-ud'], activeLines: ['ud-line-dc-ud'], anim: null
        },
        {
            sender: 'atk', text: "Extraction: Rubeus caught it! I will extract the Domain Controller's base64-encoded TGT from the UD Server's memory.",
            activeNodes: ['ud-node-atk', 'ud-node-ud'], activeLines: ['ud-line-atk-ud'], anim: 'anim-ud-atk'
        },
        {
            sender: 'atk', text: "Pass-the-Ticket: I will perform a Pass-the-Ticket (PTT) attack, injecting the stolen TGT into my own session.",
            activeNodes: ['ud-node-atk'], activeLines: [], anim: 'anim-crack'
        },
        {
            sender: 'atk', text: "Impersonation: I am now authenticated as the Domain Controller itself! I have full Domain Admin rights.",
            activeNodes: ['ud-node-atk'], activeLines: [], anim: null
        },
        {
            sender: 'atk', text: "DCSync: Let's execute a DCSync attack against the domain using these elevated privileges.",
            activeNodes: ['ud-node-atk', 'ud-node-dc'], activeLines: ['ud-line-atk-dc'], anim: 'anim-atk-dc'
        },
        {
            sender: 'dc', text: "DCSync Reply: Since you are authenticated as a Domain Controller, I approve the replication request. Here are the domain hashes.",
            activeNodes: ['ud-node-atk', 'ud-node-dc'], activeLines: ['ud-line-atk-dc'], anim: 'anim-dc-atk'
        },
        {
            sender: 'atk', text: "Success: I've dumped all the domain credentials and achieved full domain compromise!",
            activeNodes: ['ud-node-atk'], activeLines: [], anim: null
        }
    ];

    let currentStep = 0;
    
    const progressEl = document.getElementById('ud-progress');
    const prevBtn = document.getElementById('ud-prev');
    const nextBtn = document.getElementById('ud-next');
    const packetEl = document.getElementById('ud-packet');
    const diagramEl = document.getElementById('ud-diagram');
    
    const bubbleAtk = document.getElementById('ud-bubble-atk');
    const bubbleDc = document.getElementById('ud-bubble-dc');
    const bubbleUd = document.getElementById('ud-bubble-ud');
    
    const allNodes = ['ud-node-atk', 'ud-node-dc', 'ud-node-ud'];
    const allLines = ['ud-line-atk-dc', 'ud-line-dc-ud', 'ud-line-atk-ud'];

    function drawLines() {
        try {
            const getCenter = (id) => {
                const el = document.getElementById(id);
                if (!el) return {x:0, y:0};
                return {
                    x: el.offsetLeft + el.offsetWidth / 2,
                    y: el.offsetTop + el.offsetHeight / 2
                };
            };

            const cAtk = getCenter('ud-node-atk');
            const cDc = getCenter('ud-node-dc');
            const cUd = getCenter('ud-node-ud');

            const lAtkDc = document.getElementById('ud-line-atk-dc');
            if (lAtkDc) {
                lAtkDc.setAttribute('x1', cAtk.x);
                lAtkDc.setAttribute('y1', cAtk.y);
                lAtkDc.setAttribute('x2', cDc.x);
                lAtkDc.setAttribute('y2', cDc.y);
            }

            const lDcUd = document.getElementById('ud-line-dc-ud');
            if (lDcUd) {
                lDcUd.setAttribute('x1', cDc.x);
                lDcUd.setAttribute('y1', cDc.y);
                lDcUd.setAttribute('x2', cUd.x);
                lDcUd.setAttribute('y2', cUd.y);
            }
            
            const lAtkUd = document.getElementById('ud-line-atk-ud');
            if (lAtkUd) {
                lAtkUd.setAttribute('x1', cAtk.x);
                lAtkUd.setAttribute('y1', cAtk.y);
                lAtkUd.setAttribute('x2', cUd.x);
                lAtkUd.setAttribute('y2', cUd.y);
            }

            diagramEl.style.setProperty('--atk-x', cAtk.x + 'px');
            diagramEl.style.setProperty('--atk-y', cAtk.y + 'px');
            diagramEl.style.setProperty('--dc-x', cDc.x + 'px');
            diagramEl.style.setProperty('--dc-y', cDc.y + 'px');
            diagramEl.style.setProperty('--ud-x', cUd.x + 'px');
            diagramEl.style.setProperty('--ud-y', cUd.y + 'px');
        } catch(e) {
            console.error(e);
        }
    }

    window.addEventListener('resize', drawLines);

    function updateDiagram() {
        try { drawLines(); } catch(e) { console.error(e); }
        if (!steps || !steps.length) return;
        
        const step = steps[currentStep];
        if (!step) return;
        
        if (progressEl) progressEl.innerText = `[ Step ${currentStep + 1} / ${steps.length} ]`;
        
        if (prevBtn) prevBtn.disabled = currentStep === 0;
        if (nextBtn) nextBtn.disabled = currentStep === steps.length - 1;
        
        if (allNodes && step.activeNodes) {
            allNodes.forEach(id => {
                let node = document.getElementById(id);
                if (node) {
                    if (step.activeNodes.includes(id)) node.classList.add('active');
                    else node.classList.remove('active');
                    
                    if (step.anim === null && id === 'ud-node-' + step.sender) {
                        node.classList.add('waiting');
                    } else {
                        node.classList.remove('waiting');
                    }
                }
            });
        }
        
        if (allLines && step.activeLines) {
            allLines.forEach(id => {
                let line = document.getElementById(id);
                if (line) {
                    if (step.activeLines.includes(id)) line.classList.add('active');
                    else line.classList.remove('active');
                }
            });
        }
        
        if (bubbleAtk) bubbleAtk.classList.remove('show');
        if (bubbleDc) bubbleDc.classList.remove('show');
        if (bubbleUd) bubbleUd.classList.remove('show');
        
        setTimeout(() => {
            if (step.sender === 'atk' && bubbleAtk) {
                bubbleAtk.innerText = step.text;
                bubbleAtk.classList.add('show');
            } else if (step.sender === 'dc' && bubbleDc) {
                bubbleDc.innerText = step.text;
                bubbleDc.classList.add('show');
            } else if (step.sender === 'ud' && bubbleUd) {
                bubbleUd.innerText = step.text;
                bubbleUd.classList.add('show');
            }
        }, 100);
        
        if (packetEl) {
            packetEl.className = 'kerb-packet';
            void packetEl.offsetWidth; 
            if (step.anim) {
                packetEl.classList.add(step.anim);
            }
        }
    }

    if (prevBtn) {
        prevBtn.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateDiagram();
            }
        });
    }

    if (nextBtn) {
        nextBtn.addEventListener('click', () => {
            if (currentStep < steps.length - 1) {
                currentStep++;
                updateDiagram();
            }
        });
    }

    setTimeout(updateDiagram, 100);
})();
</script>
