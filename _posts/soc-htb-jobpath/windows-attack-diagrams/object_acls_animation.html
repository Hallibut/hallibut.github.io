<style>
    .kerb-container {
        font-family: inherit;
        margin: 2rem 0;
        display: flex;
        flex-direction: column;
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 1.5rem;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .kerb-diagram {
        position: relative;
        height: 440px;
        background: transparent;
        border-radius: 8px;
        overflow: visible;
    }

    .kerb-node {
        position: absolute;
        width: 140px;
        padding: 1rem 0.5rem;
        background: var(--main-bg, #1e1e1e);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        transition: all 0.3s ease;
        z-index: 10;
        color: var(--text-muted-color, #aaa);
    }
    
    .kerb-node.active {
        color: var(--text-color, #fff);
        border-color: var(--link-color, #85c49b);
        box-shadow: 0 0 15px rgba(133, 196, 155, 0.2);
    }

    .kerb-node-title {
        font-weight: 600;
        font-size: 0.85rem;
        margin-top: 10px;
    }
    
    .kerb-node-icon {
        font-size: 2.2rem;
    }

    /* Node positioning */
    #acl-node-atk { top: 160px; left: 2%; }
    #acl-node-dc { top: 30px; right: 5%; }
    #acl-node-tgt { bottom: 30px; right: 5%; }

    /* SVG Lines connecting nodes */
    .kerb-svg {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 1;
        pointer-events: none;
    }
    .kerb-line {
        stroke: rgba(255,255,255,0.2);
        stroke-width: 1.5;
        stroke-dasharray: 4, 4;
        transition: all 0.3s ease;
    }
    .kerb-line.active {
        stroke: var(--link-color, #85c49b);
        stroke-dasharray: none;
        stroke-width: 2.5;
    }

    /* Dynamic Packet animation */
    .kerb-packet {
        position: absolute;
        top: 0; left: 0;
        font-size: 1.5rem;
        color: var(--link-color, #85c49b);
        z-index: 5;
        opacity: 0;
        pointer-events: none;
        text-shadow: 0 0 12px var(--link-color, #85c49b);
    }
    
    @keyframes acl-move-atk-dc {
        0% { transform: translate(calc(var(--atk-x) - 12px), calc(var(--atk-y) - 12px)); opacity: 1; }
        100% { transform: translate(calc(var(--dc-x) - 12px), calc(var(--dc-y) - 12px)); opacity: 1; }
    }
    @keyframes acl-move-dc-atk {
        0% { transform: translate(calc(var(--dc-x) - 12px), calc(var(--dc-y) - 12px)); opacity: 1; }
        100% { transform: translate(calc(var(--atk-x) - 12px), calc(var(--atk-y) - 12px)); opacity: 1; }
    }
    @keyframes acl-move-atk-tgt {
        0% { transform: translate(calc(var(--atk-x) - 12px), calc(var(--atk-y) - 12px)); opacity: 1; }
        100% { transform: translate(calc(var(--tgt-x) - 12px), calc(var(--tgt-y) - 12px)); opacity: 1; }
    }
    @keyframes acl-offline-crack {
        0% { transform: translate(calc(var(--atk-x) - 12px), calc(var(--atk-y) - 12px)) scale(1); opacity: 1; color: var(--link-color); text-shadow: 0 0 10px var(--link-color); }
        50% { transform: translate(calc(var(--atk-x) - 12px), calc(var(--atk-y) - 12px)) scale(2); opacity: 1; color: #ef4444; text-shadow: 0 0 20px #ef4444; }
        100% { transform: translate(calc(var(--atk-x) - 12px), calc(var(--atk-y) - 12px)) scale(1); opacity: 0; }
    }

    .anim-atk-dc { animation: acl-move-atk-dc 1.5s ease-in-out forwards; }
    .anim-dc-atk { animation: acl-move-dc-atk 1.5s ease-in-out forwards; }
    .anim-atk-tgt { animation: acl-move-atk-tgt 1.5s ease-in-out forwards; }
    .anim-crack { animation: acl-offline-crack 2s ease-in-out forwards; }

    /* Waiting Icon */
    .waiting-icon {
        display: none;
        position: absolute;
        top: -12px;
        right: -12px;
        font-size: 1.2rem;
        color: var(--link-color, #85c49b);
        background: var(--main-bg, #1e1e1e);
        border-radius: 50%;
        width: 32px;
        height: 32px;
        line-height: 32px;
        text-align: center;
        box-shadow: 0 0 10px rgba(0,0,0,0.8);
        z-index: 15;
    }
    .kerb-node.waiting .waiting-icon {
        display: block;
    }

    /* Chat Bubbles */
    .chat-bubble {
        position: absolute;
        background: rgba(30, 30, 30, 0.95);
        border: 1px solid var(--link-color, #85c49b);
        color: #fff;
        padding: 0.8rem 1rem;
        border-radius: 8px;
        font-size: 0.8rem;
        line-height: 1.5;
        max-width: 340px;
        z-index: 20;
        opacity: 0;
        transform: translateY(10px);
        transition: all 0.4s ease;
        pointer-events: none;
        box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    .chat-bubble.show {
        opacity: 1;
        transform: translateY(0);
    }
    .chat-bubble::after {
        content: '';
        position: absolute;
        width: 0; height: 0;
    }
    
    #acl-diagram .bubble-atk { left: 2%; top: 60px; }
    #acl-diagram .bubble-atk::after { top: auto; bottom: -12px; left: 70px; border: 6px solid transparent; border-top-color: var(--link-color, #85c49b); }
    #acl-diagram .bubble-dc { right: 200px; top: 30px; }
    #acl-diagram .bubble-dc::after { top: 20px; bottom: auto; right: -12px; left: auto; border: 6px solid transparent; border-left-color: var(--link-color, #85c49b); }
    #acl-diagram .bubble-tgt { right: 200px; bottom: 30px; }
    #acl-diagram .bubble-tgt::after { top: 20px; bottom: auto; right: -12px; left: auto; border: 6px solid transparent; border-left-color: var(--link-color, #85c49b); }

    /* Responsive Design */
    @media (max-width: 650px) {
        .kerb-node {
            width: 100px;
            padding: 0.5rem;
        }
        .kerb-node-icon { font-size: 1.5rem; }
        .kerb-node-title { font-size: 0.75rem; }
        #acl-node-atk { left: 0%; top: 160px; }
        #acl-node-dc { right: 0%; top: 40px; }
        #acl-node-tgt { right: 0%; bottom: 30px; }
        
        #acl-diagram .bubble-atk { left: 0%; top: 60px; max-width: 200px; font-size: 0.8rem; }
        #acl-diagram .bubble-dc { right: 110px; top: 30px; max-width: 200px; font-size: 0.8rem; }
        #acl-diagram .bubble-tgt { right: 110px; bottom: 30px; max-width: 200px; font-size: 0.8rem; }
        
        #acl-diagram .bubble-atk::after { left: 45px; }
        #acl-diagram .bubble-dc::after { top: 20px; bottom: auto; right: -12px; left: auto; border: 6px solid transparent; border-left-color: var(--link-color, #85c49b); }
        #acl-diagram .bubble-tgt::after { top: 20px; bottom: auto; right: -12px; left: auto; border: 6px solid transparent; border-left-color: var(--link-color, #85c49b); }
    }

    /* Controls */
    .kerb-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 1.5rem;
        border-top: 1px solid rgba(255,255,255,0.1);
        margin-top: 1rem;
    }
    
    .kerb-btn {
        background: rgba(255,255,255,0.05);
        color: var(--text-color, #fff);
        border: 1px solid rgba(255,255,255,0.2);
        padding: 0.5rem 1.2rem;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 600;
        transition: all 0.2s ease;
    }
    .kerb-btn:hover:not(:disabled) {
        background: rgba(133, 196, 155, 0.2);
        color: var(--link-color, #85c49b);
        border-color: var(--link-color, #85c49b);
    }
    .kerb-btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
    }
    
    .kerb-progress {
        font-size: 0.9rem;
        color: var(--text-muted-color, #aaa);
        font-weight: 600;
    }
</style>

<div class="kerb-container" id="acl-container">
    <div class="kerb-diagram" id="acl-diagram">
        <!-- SVG for lines -->
        <svg class="kerb-svg">
            <line class="kerb-line" id="acl-line-atk-dc" />
            <line class="kerb-line" id="acl-line-atk-tgt" />
        </svg>

        <!-- Nodes with FontAwesome icons -->
        <div class="kerb-node" id="acl-node-atk">
            <i class="fas fa-spinner fa-spin waiting-icon"></i>
            <i class="fas fa-laptop-code kerb-node-icon"></i>
            <div class="kerb-node-title">Attacker<br><span style="font-size: 0.75em; opacity: 0.7">(Compromised User)</span></div>
        </div>
        
        <div class="kerb-node" id="acl-node-dc">
            <i class="fas fa-spinner fa-spin waiting-icon"></i>
            <i class="fas fa-sitemap kerb-node-icon"></i>
            <div class="kerb-node-title">Domain Controller<br><span style="font-size: 0.75em; opacity: 0.7">(Active Directory)</span></div>
        </div>

        <div class="kerb-node" id="acl-node-tgt">
            <i class="fas fa-spinner fa-spin waiting-icon"></i>
            <i class="fas fa-user-shield kerb-node-icon"></i>
            <div class="kerb-node-title">Target Object<br><span style="font-size: 0.75em; opacity: 0.7">(Privileged Account)</span></div>
        </div>

        <!-- Chat Bubbles -->
        <div class="chat-bubble bubble-atk" id="acl-bubble-atk"></div>
        <div class="chat-bubble bubble-dc" id="acl-bubble-dc"></div>
        <div class="chat-bubble bubble-tgt" id="acl-bubble-tgt"></div>

        <!-- Packet -->
        <div class="kerb-packet" id="acl-packet"><i class="fas fa-envelope"></i></div>
    </div>
    
    <div class="kerb-controls">
        <button class="kerb-btn" id="acl-prev" disabled>← Prev</button>
        <span class="kerb-progress" id="acl-progress">[ Step 1 / 10 ]</span>
        <button class="kerb-btn" id="acl-next">Next →</button>
    </div>
</div>

<script>
(() => {
    const steps = [
        {
            sender: 'atk', text: "Reconnaissance: I will run SharpHound to collect all ACLs, group memberships, and sessions from the Domain Controller via LDAP.",
            activeNodes: ['acl-node-atk', 'acl-node-dc'], activeLines: ['acl-line-atk-dc'], anim: 'anim-atk-dc'
        },
        {
            sender: 'dc', text: "Data Collection: Here is the raw directory data, including all Access Control Entries (ACEs) mapping who can control what.",
            activeNodes: ['acl-node-atk', 'acl-node-dc'], activeLines: ['acl-line-atk-dc'], anim: 'anim-dc-atk'
        },
        {
            sender: 'atk', text: "Analysis: Loading the data into BloodHound... I found a hidden path! My compromised account has 'GenericWrite' permissions over a Domain Admin account.",
            activeNodes: ['acl-node-atk'], activeLines: [], anim: null
        },
        {
            sender: 'tgt', text: "Target Object: I am a highly privileged Domain Admin account. But due to misconfigurations, this standard user has rights to modify my attributes!",
            activeNodes: ['acl-node-atk', 'acl-node-tgt'], activeLines: ['acl-line-atk-tgt'], anim: null
        },
        {
            sender: 'atk', text: "Exploitation (Targeted Kerberoasting): Because I have 'GenericWrite', I can modify the target account. Let's add an arbitrary Service Principal Name (SPN).",
            activeNodes: ['acl-node-atk', 'acl-node-dc'], activeLines: ['acl-line-atk-dc'], anim: 'anim-atk-dc'
        },
        {
            sender: 'dc', text: "LDAP Modify: Authorized. The SPN 'fake/service' has been successfully added to the Domain Admin's account attributes.",
            activeNodes: ['acl-node-atk', 'acl-node-dc'], activeLines: ['acl-line-atk-dc'], anim: 'anim-dc-atk'
        },
        {
            sender: 'atk', text: "Kerberos Request: Now that the account has an SPN, it is vulnerable to Kerberoasting! I will request a Kerberos TGS (Service Ticket) for it.",
            activeNodes: ['acl-node-atk', 'acl-node-dc'], activeLines: ['acl-line-atk-dc'], anim: 'anim-atk-dc'
        },
        {
            sender: 'dc', text: "Ticket Granting Service: A valid SPN exists. Here is the TGS ticket, encrypted with the Domain Admin's NTLM hash.",
            activeNodes: ['acl-node-atk', 'acl-node-dc'], activeLines: ['acl-line-atk-dc'], anim: 'anim-dc-atk'
        },
        {
            sender: 'atk', text: "Offline Cracking: I will extract the encrypted TGS ticket and crack it offline using tools like Hashcat or John the Ripper.",
            activeNodes: ['acl-node-atk'], activeLines: [], anim: 'anim-crack'
        },
        {
            sender: 'atk', text: "Success: The hash cracked! I now have the plaintext password of the Domain Admin and full control over the entire domain.",
            activeNodes: ['acl-node-atk'], activeLines: [], anim: null
        }
    ];

    let currentStep = 0;
    
    const progressEl = document.getElementById('acl-progress');
    const prevBtn = document.getElementById('acl-prev');
    const nextBtn = document.getElementById('acl-next');
    const packetEl = document.getElementById('acl-packet');
    const diagramEl = document.getElementById('acl-diagram');
    
    const bubbleAtk = document.getElementById('acl-bubble-atk');
    const bubbleDc = document.getElementById('acl-bubble-dc');
    const bubbleTgt = document.getElementById('acl-bubble-tgt');
    
    const allNodes = ['acl-node-atk', 'acl-node-dc', 'acl-node-tgt'];
    const allLines = ['acl-line-atk-dc', 'acl-line-atk-tgt'];

    function drawLines() {
        try {
            const getCenter = (id) => {
                const el = document.getElementById(id);
                if (!el) return {x:0, y:0};
                return {
                    x: el.offsetLeft + el.offsetWidth / 2,
                    y: el.offsetTop + el.offsetHeight / 2
                };
            };

            const cAtk = getCenter('acl-node-atk');
            const cDc = getCenter('acl-node-dc');
            const cTgt = getCenter('acl-node-tgt');

            const lAtkDc = document.getElementById('acl-line-atk-dc');
            if (lAtkDc) {
                lAtkDc.setAttribute('x1', cAtk.x);
                lAtkDc.setAttribute('y1', cAtk.y);
                lAtkDc.setAttribute('x2', cDc.x);
                lAtkDc.setAttribute('y2', cDc.y);
            }

            const lAtkTgt = document.getElementById('acl-line-atk-tgt');
            if (lAtkTgt) {
                lAtkTgt.setAttribute('x1', cAtk.x);
                lAtkTgt.setAttribute('y1', cAtk.y);
                lAtkTgt.setAttribute('x2', cTgt.x);
                lAtkTgt.setAttribute('y2', cTgt.y);
            }

            diagramEl.style.setProperty('--atk-x', cAtk.x + 'px');
            diagramEl.style.setProperty('--atk-y', cAtk.y + 'px');
            diagramEl.style.setProperty('--dc-x', cDc.x + 'px');
            diagramEl.style.setProperty('--dc-y', cDc.y + 'px');
            diagramEl.style.setProperty('--tgt-x', cTgt.x + 'px');
            diagramEl.style.setProperty('--tgt-y', cTgt.y + 'px');
        } catch(e) {
            console.error(e);
        }
    }

    window.addEventListener('resize', drawLines);

    function updateDiagram() {
        try { drawLines(); } catch(e) { console.error(e); }
        if (!steps || !steps.length) return;
        
        const step = steps[currentStep];
        if (!step) return;
        
        if (progressEl) progressEl.innerText = `[ Step ${currentStep + 1} / ${steps.length} ]`;
        
        if (prevBtn) prevBtn.disabled = currentStep === 0;
        if (nextBtn) nextBtn.disabled = currentStep === steps.length - 1;
        
        if (allNodes && step.activeNodes) {
            allNodes.forEach(id => {
                let node = document.getElementById(id);
                if (node) {
                    if (step.activeNodes.includes(id)) node.classList.add('active');
                    else node.classList.remove('active');
                    
                    if (step.anim === null && id === 'acl-node-' + step.sender) {
                        node.classList.add('waiting');
                    } else {
                        node.classList.remove('waiting');
                    }
                }
            });
        }
        
        if (allLines && step.activeLines) {
            allLines.forEach(id => {
                let line = document.getElementById(id);
                if (line) {
                    if (step.activeLines.includes(id)) line.classList.add('active');
                    else line.classList.remove('active');
                }
            });
        }
        
        if (bubbleAtk) bubbleAtk.classList.remove('show');
        if (bubbleDc) bubbleDc.classList.remove('show');
        if (bubbleTgt) bubbleTgt.classList.remove('show');
        
        setTimeout(() => {
            if (step.sender === 'atk' && bubbleAtk) {
                bubbleAtk.innerText = step.text;
                bubbleAtk.classList.add('show');
            } else if (step.sender === 'dc' && bubbleDc) {
                bubbleDc.innerText = step.text;
                bubbleDc.classList.add('show');
            } else if (step.sender === 'tgt' && bubbleTgt) {
                bubbleTgt.innerText = step.text;
                bubbleTgt.classList.add('show');
            }
        }, 100);
        
        if (packetEl) {
            packetEl.className = 'kerb-packet';
            void packetEl.offsetWidth; 
            if (step.anim) {
                packetEl.classList.add(step.anim);
            }
        }
    }

    if (prevBtn) {
        prevBtn.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateDiagram();
            }
        });
    }

    if (nextBtn) {
        nextBtn.addEventListener('click', () => {
            if (currentStep < steps.length - 1) {
                currentStep++;
                updateDiagram();
            }
        });
    }

    setTimeout(updateDiagram, 100);
})();
</script>
