<style>
    .kerb-container {
        font-family: inherit;
        margin: 2rem 0;
        display: flex;
        flex-direction: column;
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 1.5rem;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .kerb-diagram {
        position: relative;
        height: 420px;
        background: transparent;
        border-radius: 8px;
        overflow: visible;
    }

    .kerb-node {
        position: absolute;
        width: 140px;
        padding: 1rem 0.5rem;
        background: var(--main-bg, #1e1e1e);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        transition: all 0.3s ease;
        z-index: 10;
        color: var(--text-muted-color, #aaa);
    }
    
    .kerb-node.active {
        color: var(--text-color, #fff);
        border-color: var(--link-color, #85c49b);
        box-shadow: 0 0 15px rgba(133, 196, 155, 0.2);
    }

    .kerb-node-title {
        font-weight: 600;
        font-size: 0.85rem;
        margin-top: 10px;
    }
    
    .kerb-node-icon {
        font-size: 2.2rem;
    }

    /* Node positioning */
    #node-atk { top: 160px; left: 2%; }
    #node-dc { top: 80px; right: 5%; }
    #node-svc { bottom: 20px; right: 5%; }

    /* SVG Lines connecting nodes */
    .kerb-svg {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 1;
        pointer-events: none;
    }
    .kerb-line {
        stroke: rgba(255,255,255,0.2);
        stroke-width: 1.5;
        stroke-dasharray: 4, 4;
        transition: all 0.3s ease;
    }
    .kerb-line.active {
        stroke: var(--link-color, #85c49b);
        stroke-dasharray: none;
        stroke-width: 2.5;
    }

    /* Dynamic Packet animation */
    .kerb-packet {
        position: absolute;
        top: 0; left: 0;
        font-size: 1.5rem;
        color: var(--link-color, #85c49b);
        z-index: 5;
        opacity: 0;
        pointer-events: none;
        text-shadow: 0 0 12px var(--link-color, #85c49b);
    }
    
    @keyframes move-atk-dc {
        0% { transform: translate(calc(var(--atk-x) - 12px), calc(var(--atk-y) - 12px)); opacity: 1; }
        100% { transform: translate(calc(var(--dc-x) - 12px), calc(var(--dc-y) - 12px)); opacity: 1; }
    }
    @keyframes move-dc-atk {
        0% { transform: translate(calc(var(--dc-x) - 12px), calc(var(--dc-y) - 12px)); opacity: 1; }
        100% { transform: translate(calc(var(--atk-x) - 12px), calc(var(--atk-y) - 12px)); opacity: 1; }
    }
    @keyframes offline-crack {
        0% { transform: translate(calc(var(--atk-x) - 12px), calc(var(--atk-y) - 12px)) scale(1); opacity: 1; color: var(--link-color); text-shadow: 0 0 10px var(--link-color); }
        50% { transform: translate(calc(var(--atk-x) - 12px), calc(var(--atk-y) - 12px)) scale(2); opacity: 1; color: #ef4444; text-shadow: 0 0 20px #ef4444; }
        100% { transform: translate(calc(var(--atk-x) - 12px), calc(var(--atk-y) - 12px)) scale(1); opacity: 0; }
    }

    @keyframes move-atk-svc {
        0% { transform: translate(calc(var(--atk-x) - 12px), calc(var(--atk-y) - 12px)); opacity: 1; color: var(--link-color); text-shadow: 0 0 10px var(--link-color); }
        100% { transform: translate(calc(var(--svc-x) - 12px), calc(var(--svc-y) - 12px)); opacity: 1; color: #ef4444; text-shadow: 0 0 15px #ef4444; }
    }

    .anim-atk-dc { animation: move-atk-dc 1.5s ease-in-out forwards; }
    .anim-dc-atk { animation: move-dc-atk 1.5s ease-in-out forwards; }
    .anim-crack { animation: offline-crack 2s ease-in-out forwards; }
    .anim-atk-svc { animation: move-atk-svc 1.5s ease-in-out forwards; }

    /* Waiting Icon */
    .waiting-icon {
        display: none;
        position: absolute;
        top: -12px;
        right: -12px;
        font-size: 1.2rem;
        color: var(--link-color, #85c49b);
        background: var(--main-bg, #1e1e1e);
        border-radius: 50%;
        width: 32px;
        height: 32px;
        line-height: 32px;
        text-align: center;
        box-shadow: 0 0 10px rgba(0,0,0,0.8);
        z-index: 15;
    }
    .kerb-node.waiting .waiting-icon {
        display: block;
    }

    /* Chat Bubbles */
    .chat-bubble {
        position: absolute;
        background: rgba(30, 30, 30, 0.95);
        border: 1px solid var(--link-color, #85c49b);
        color: #fff;
        padding: 0.8rem 1rem;
        border-radius: 8px;
        font-size: 0.8rem;
        line-height: 1.5;
        max-width: 250px;
        z-index: 20;
        opacity: 0;
        transform: translateY(10px);
        transition: all 0.4s ease;
        pointer-events: none;
        box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    .chat-bubble.show {
        opacity: 1;
        transform: translateY(0);
    }
    .chat-bubble::after {
        content: '';
        position: absolute;
        width: 0; height: 0;
    }
    /* Bubble for Attacker (placed above) */
    #kerb-diagram .bubble-atk {
        left: 2%;
        top: 20px;
    }
    #kerb-diagram .bubble-atk::after {
        top: 100%; left: 70px;
        border: 6px solid transparent;
        border-top-color: var(--link-color, #85c49b);
    }
    /* Bubble for DC (placed above DC) */
    #kerb-diagram .bubble-dc {
        right: 5%;
        top: -30px;
    }
    #kerb-diagram .bubble-dc::after {
        top: 100%; right: 70px;
        border: 6px solid transparent;
        border-top-color: var(--link-color, #85c49b);
    }

    /* Responsive Design */
    @media (max-width: 650px) {
        .kerb-node {
            width: 100px;
            padding: 0.5rem;
        }
        .kerb-node-icon { font-size: 1.5rem; }
        .kerb-node-title { font-size: 0.75rem; }
        #node-atk { left: 0%; top: 160px; }
        #node-dc { right: 0%; top: 80px; }
        #node-svc { right: 0%; bottom: 20px; }
        #kerb-diagram .bubble-atk { left: 0%; top: 10px; max-width: 200px; font-size: 0.8rem; }
        #kerb-diagram .bubble-dc { right: 0%; top: -30px; max-width: 200px; font-size: 0.8rem; }
        #kerb-diagram .bubble-atk::after { left: 45px; }
        #kerb-diagram .bubble-dc::after { right: 45px; }
    }


    /* Controls */
    .kerb-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 1.5rem;
        border-top: 1px solid rgba(255,255,255,0.1);
        margin-top: 1rem;
    }
    
    .kerb-btn {
        background: rgba(255,255,255,0.05);
        color: var(--text-color, #fff);
        border: 1px solid rgba(255,255,255,0.2);
        padding: 0.5rem 1.2rem;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 600;
        transition: all 0.2s ease;
    }
    .kerb-btn:hover:not(:disabled) {
        background: rgba(133, 196, 155, 0.2);
        color: var(--link-color, #85c49b);
        border-color: var(--link-color, #85c49b);
    }
    .kerb-btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
    }
    
    .kerb-progress {
        font-size: 0.9rem;
        color: var(--text-muted-color, #aaa);
        font-weight: 600;
    }
</style>

<div class="kerb-container">
    <div class="kerb-diagram" id="kerb-diagram">
        <!-- SVG for lines -->
        <svg class="kerb-svg">
            <line class="kerb-line" id="line-atk-dc" />
            <line class="kerb-line" id="line-atk-svc" />
        </svg>

        <!-- Nodes with FontAwesome icons -->
        <div class="kerb-node" id="node-atk">
            <i class="fas fa-spinner fa-spin waiting-icon"></i>
            <i class="fas fa-laptop-code kerb-node-icon"></i>
            <div class="kerb-node-title">Attacker<br><span style="font-size: 0.75em; opacity: 0.7">(Compromised Machine)</span></div>
        </div>
        
        <div class="kerb-node" id="node-dc">
            <i class="fas fa-spinner fa-spin waiting-icon"></i>
            <i class="fas fa-server kerb-node-icon"></i>
            <div class="kerb-node-title">Domain Controller</div>
        </div>
        
        <div class="kerb-node" id="node-svc">
            <i class="fas fa-spinner fa-spin waiting-icon"></i>
            <i class="fas fa-cogs kerb-node-icon"></i>
            <div class="kerb-node-title">Target Service</div>
        </div>

        <!-- Chat Bubbles -->
        <div class="chat-bubble bubble-atk" id="bubble-atk"></div>
        <div class="chat-bubble bubble-dc" id="bubble-dc"></div>

        <!-- Packet -->
        <div class="kerb-packet" id="kerb-packet"><i class="fas fa-envelope"></i></div>
    </div>
    
    <div class="kerb-controls">
        <button class="kerb-btn" id="kerb-prev" disabled>← Prev</button>
        <span class="kerb-progress" id="kerb-progress">[ Step 1 / 1 ]</span>
        <button class="kerb-btn" id="kerb-next">Next →</button>
    </div>
</div>

<script>
    const steps = [
        {
            sender: 'atk', text: "Initial Access: I've compromised a domain machine and dumped its memory.",
            activeNodes: ['node-atk'], activeLines: [], anim: null
        },
        {
            sender: 'atk', text: "I've stolen an employee's password hash from memory to masquerade as them.",
            activeNodes: ['node-atk'], activeLines: [], anim: null
        },
        {
            sender: 'atk', text: "AS-REQ: First, I need a Ticket Granting Ticket (TGT) to interact with the domain.",
            activeNodes: ['node-atk', 'node-dc'], activeLines: ['line-atk-dc'], anim: null
        },
        {
            sender: 'atk', text: "To prove who I am, I've encrypted a timestamp using the hash I just stole!",
            activeNodes: ['node-atk', 'node-dc'], activeLines: ['line-atk-dc'], anim: 'anim-atk-dc'
        },
        {
            sender: 'dc', text: "Pre-Auth Validation: I'm pulling your stored password hash from AD...",
            activeNodes: ['node-dc'], activeLines: [], anim: null
        },
        {
            sender: 'dc', text: "...and trying to decrypt the timestamp you just sent.",
            activeNodes: ['node-dc'], activeLines: [], anim: null
        },
        {
            sender: 'dc', text: "AS-REP: Decryption successful! Password confirmed. Here is your TGT.",
            activeNodes: ['node-atk', 'node-dc'], activeLines: ['line-atk-dc'], anim: 'anim-dc-atk'
        },
        {
            sender: 'atk', text: "LDAP Query: Now that I'm authenticated, which Service Accounts have an SPN?",
            activeNodes: ['node-atk', 'node-dc'], activeLines: ['line-atk-dc'], anim: null
        },
        {
            sender: 'atk', text: "(I need their SPNs to steal their password hashes, not my own!)",
            activeNodes: ['node-atk', 'node-dc'], activeLines: ['line-atk-dc'], anim: 'anim-atk-dc'
        },
        {
            sender: 'dc', text: "LDAP Reply: Here is a list of vulnerable service accounts.",
            activeNodes: ['node-atk', 'node-dc'], activeLines: ['line-atk-dc'], anim: 'anim-dc-atk'
        },
        {
            sender: 'atk', text: "TGS-REQ: I want a Service Ticket for that target SPN.",
            activeNodes: ['node-atk', 'node-dc'], activeLines: ['line-atk-dc'], anim: null
        },
        {
            sender: 'atk', text: "(Kerberos doesn't check if I actually have permission to access it yet!)",
            activeNodes: ['node-atk', 'node-dc'], activeLines: ['line-atk-dc'], anim: 'anim-atk-dc'
        },
        {
            sender: 'dc', text: "TGS-REP: I don't check permissions, I just issue tickets!",
            activeNodes: ['node-atk', 'node-dc'], activeLines: ['line-atk-dc'], anim: null
        },
        {
            sender: 'dc', text: "Here is the ticket, encrypted with the target service account's password hash.",
            activeNodes: ['node-atk', 'node-dc'], activeLines: ['line-atk-dc'], anim: 'anim-dc-atk'
        },
        {
            sender: 'atk', text: "Extraction: Dumping the .kirbi ticket from memory using Rubeus.",
            activeNodes: ['node-atk'], activeLines: [], anim: null
        },
        {
            sender: 'atk', text: "Offline Cracking: Brute-forcing the RC4 hash with Hashcat!",
            activeNodes: ['node-atk'], activeLines: [], anim: 'anim-crack'
        },
        {
            sender: 'atk', text: "Compromise: Password cracked! Logging directly into the Target Service.",
            activeNodes: ['node-atk', 'node-svc'], activeLines: ['line-atk-svc'], anim: 'anim-atk-svc'
        }
    ];

    let currentStep = 0;
    
    const progressEl = document.getElementById('kerb-progress');
    const prevBtn = document.getElementById('kerb-prev');
    const nextBtn = document.getElementById('kerb-next');
    const packetEl = document.getElementById('kerb-packet');
    
    const bubbleAtk = document.getElementById('bubble-atk');
    const bubbleDc = document.getElementById('bubble-dc');
    
    const allNodes = ['node-atk', 'node-dc', 'node-svc'];
    const allLines = ['line-atk-dc', 'line-atk-svc'];

    function drawLines() {
        const getCenter = (id) => {
            const el = document.getElementById(id);
            return {
                x: el.offsetLeft + el.offsetWidth / 2,
                y: el.offsetTop + el.offsetHeight / 2
            };
        };

        const cAtk = getCenter('node-atk');
        const cDc = getCenter('node-dc');
        const cSvc = getCenter('node-svc');

        // Update SVG Lines
        const lAtkDc = document.getElementById('line-atk-dc');
        lAtkDc.setAttribute('x1', cAtk.x);
        lAtkDc.setAttribute('y1', cAtk.y);
        lAtkDc.setAttribute('x2', cDc.x);
        lAtkDc.setAttribute('y2', cDc.y);

        const lAtkSvc = document.getElementById('line-atk-svc');
        lAtkSvc.setAttribute('x1', cAtk.x);
        lAtkSvc.setAttribute('y1', cAtk.y);
        lAtkSvc.setAttribute('x2', cSvc.x);
        lAtkSvc.setAttribute('y2', cSvc.y);

        // Update CSS Variables for Packet Animation
        document.documentElement.style.setProperty('--atk-x', cAtk.x + 'px');
        document.documentElement.style.setProperty('--atk-y', cAtk.y + 'px');
        document.documentElement.style.setProperty('--dc-x', cDc.x + 'px');
        document.documentElement.style.setProperty('--dc-y', cDc.y + 'px');
        document.documentElement.style.setProperty('--svc-x', cSvc.x + 'px');
        document.documentElement.style.setProperty('--svc-y', cSvc.y + 'px');
    }

    // Recalculate on load and resize
    window.addEventListener('resize', drawLines);

    function updateDiagram() {
        drawLines();
        const step = steps[currentStep];
        
        progressEl.innerText = `[ Step ${currentStep + 1} / ${steps.length} ]`;
        
        prevBtn.disabled = currentStep === 0;
        nextBtn.disabled = currentStep === steps.length - 1;
        
        allNodes.forEach(id => {
            let node = document.getElementById(id);
            if (step.activeNodes.includes(id)) node.classList.add('active');
            else node.classList.remove('active');
            
            if (step.anim === null && id === 'node-' + step.sender) {
                node.classList.add('waiting');
            } else {
                node.classList.remove('waiting');
            }
        });
        
        allLines.forEach(id => {
            if (step.activeLines.includes(id)) document.getElementById(id).classList.add('active');
            else document.getElementById(id).classList.remove('active');
        });
        
        bubbleAtk.classList.remove('show');
        bubbleDc.classList.remove('show');
        
        setTimeout(() => {
            if (step.sender === 'atk') {
                bubbleAtk.innerText = step.text;
                bubbleAtk.classList.add('show');
            } else if (step.sender === 'dc') {
                bubbleDc.innerText = step.text;
                bubbleDc.classList.add('show');
            }
        }, 100);
        
        packetEl.className = 'kerb-packet';
        void packetEl.offsetWidth; 
        
        if (step.anim) {
            packetEl.classList.add(step.anim);
        }
    }

    prevBtn.addEventListener('click', () => {
        if (currentStep > 0) {
            currentStep--;
            updateDiagram();
        }
    });

    nextBtn.addEventListener('click', () => {
        if (currentStep < steps.length - 1) {
            currentStep++;
            updateDiagram();
        }
    });

    setTimeout(updateDiagram, 100);
</script>
